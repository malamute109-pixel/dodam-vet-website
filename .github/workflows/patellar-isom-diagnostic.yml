name: Patellar 1v1 Playtest Build

on:
  push:
    branches:
      - chatgpt-patellar-isom-build
  workflow_dispatch:

concurrency:
  group: patellar-isom-terrain-build
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Clone IsomTerrain
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/TheNitesWhoSay/IsomTerrain.git "$env:RUNNER_TEMP\IsomTerrain"

      - name: Install generator and CI save fix
        shell: pwsh
        run: |
          Copy-Item "tools\patellar_isom_generator.cpp" "$env:RUNNER_TEMP\IsomTerrain\IsomTerrain\Main.cpp" -Force

          # This generated melee map has no custom MPQ assets. Upstream MapFile::save
          # still opens a temporary MPQ inside processModifiedAssets(), which can block
          # on headless CI. Return immediately when the asset list is empty.
          $mapFileCpp = "$env:RUNNER_TEMP\IsomTerrain\MappingCoreLib\MapFile.cpp"
          $src = Get-Content $mapFileCpp -Raw
          $needle = "bool MapFile::processModifiedAssets(bool updateListFile)`r`n{"
          if (!$src.Contains($needle)) {
            $needle = "bool MapFile::processModifiedAssets(bool updateListFile)`n{"
          }
          if (!$src.Contains($needle)) { throw "Could not locate processModifiedAssets in MapFile.cpp" }
          $replacement = $needle + "`r`n    if ( modifiedAssets.empty() )`r`n        return true; // generated map: no temporary asset MPQ required"
          $src = $src.Replace($needle, $replacement)
          Set-Content $mapFileCpp $src

          Get-ChildItem "$env:RUNNER_TEMP\IsomTerrain" -Filter *.vcxproj -Recurse | ForEach-Object {
            $xml = Get-Content $_.FullName -Raw
            $xml = $xml.Replace('v142','v143')
            $xml = $xml.Replace('<EnableASAN>true</EnableASAN>','<EnableASAN>false</EnableASAN>')
            Set-Content $_.FullName $xml
          }

      - name: Download Jungle CV5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MaksymAlokhin/StarCraftMapBrowser/master/Tileset/jungle.cv5" -OutFile "$env:RUNNER_TEMP\jungle.cv5"

      - name: Build IsomTerrain generator
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          msbuild "%RUNNER_TEMP%\IsomTerrain\IsomTerrain.sln" /m /p:Configuration=ReleaseUS /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0

      - name: Generate and validate 1v1 SCX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build-output" | Out-Null
          $exe = "$env:RUNNER_TEMP\IsomTerrain\x64\ReleaseUS\IsomTerrain.exe"
          if (!(Test-Path $exe)) { throw "Generator executable not found: $exe" }
          $stdout = Join-Path $env:RUNNER_TEMP "patellar-generator.out.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "patellar-generator.err.txt"
          $output = "build-output\Patellar_Luxation_v10_1v1_Playtest.scx"
          $args = @("$env:RUNNER_TEMP\jungle.cv5", $output)
          $p = Start-Process -FilePath $exe -ArgumentList $args -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -NoNewWindow
          $finished = $p.WaitForExit(60000)
          if (!$finished) {
            try { $p.Kill($true) } catch {}
            Write-Host "=== generator stdout before timeout ==="
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "=== generator stderr before timeout ==="
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Generator exceeded 60 seconds and was terminated"
          }
          Write-Host "=== generator stdout ==="
          if (Test-Path $stdout) { Get-Content $stdout }
          Write-Host "=== generator stderr ==="
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($p.ExitCode -ne 0) { throw "Generator failed with exit code $($p.ExitCode)" }
          Get-Item $output | Format-List Name,Length,FullName

      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patellar-Luxation-v10-1v1-Playtest
          path: build-output/Patellar_Luxation_v10_1v1_Playtest.scx
          if-no-files-found: error
