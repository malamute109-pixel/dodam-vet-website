name: Patellar Fighting Spirit Ramp Probe v1.8

on:
  push:
    branches:
      - chatgpt-patellar-isom-build
    paths:
      - 'tools/patellar_fighting_spirit_ramp_probe_v18.cpp'
      - '.github/workflows/patellar-fighting-spirit-ramp-probe-v18.yml'
  workflow_dispatch:

concurrency:
  group: patellar-fighting-spirit-ramp-probe-v18
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Clone IsomTerrain
        shell: pwsh
        run: git clone --depth 1 https://github.com/TheNitesWhoSay/IsomTerrain.git "$env:RUNNER_TEMP\IsomTerrain"
      - name: Install probe and VS2022 settings
        shell: pwsh
        run: |
          Copy-Item "tools\patellar_fighting_spirit_ramp_probe_v18.cpp" "$env:RUNNER_TEMP\IsomTerrain\IsomTerrain\Main.cpp" -Force
          Get-ChildItem "$env:RUNNER_TEMP\IsomTerrain" -Filter *.vcxproj -Recurse | ForEach-Object {
            $xml=Get-Content $_.FullName -Raw
            $xml=$xml.Replace('v142','v143').Replace('<EnableASAN>true</EnableASAN>','<EnableASAN>false</EnableASAN>')
            Set-Content $_.FullName $xml
          }
      - name: Download Jungle data and Fighting Spirit
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MaksymAlokhin/StarCraftMapBrowser/master/Tileset/jungle.cv5" -OutFile "$env:RUNNER_TEMP\jungle.cv5"
          $headers=@{'User-Agent'='Mozilla/5.0'}
          Invoke-WebRequest -Uri "https://scmscx.com/api/maps/df7d5e430027644b96109934b5e9233111aa049385187b79fa0bafa11720c34b" -Headers $headers -OutFile "$env:RUNNER_TEMP\Fighting_Spirit_1.3_MLC.scx"
      - name: Build probe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          msbuild "%RUNNER_TEMP%\IsomTerrain\IsomTerrain.sln" /m /p:Configuration=ReleaseUS /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0
      - name: Probe standard melee ramps
        shell: pwsh
        run: |
          $exe="$env:RUNNER_TEMP\IsomTerrain\x64\ReleaseUS\IsomTerrain.exe"
          & $exe "$env:RUNNER_TEMP\jungle.cv5" "$env:RUNNER_TEMP\Fighting_Spirit_1.3_MLC.scx" 2>&1 | Tee-Object -FilePath fighting-spirit-ramp-candidates.txt
          if($LASTEXITCODE -ne 0){throw "probe failed $LASTEXITCODE"}
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: fighting-spirit-ramp-candidates-v18
          path: fighting-spirit-ramp-candidates.txt
          if-no-files-found: error
