name: Patellar Jungle Ramp Probe

on:
  push:
    branches:
      - chatgpt-patellar-isom-build
    paths:
      - 'tools/patellar_ramp_probe.cpp'
      - '.github/workflows/patellar-ramp-db-probe.yml'
  workflow_dispatch:

jobs:
  probe-ramps:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Clone IsomTerrain
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/TheNitesWhoSay/IsomTerrain.git "$env:RUNNER_TEMP\IsomTerrain"

      - name: Install probe and VS2022 settings
        shell: pwsh
        run: |
          Copy-Item "tools\patellar_ramp_probe.cpp" "$env:RUNNER_TEMP\IsomTerrain\IsomTerrain\Main.cpp" -Force
          Get-ChildItem "$env:RUNNER_TEMP\IsomTerrain" -Filter *.vcxproj -Recurse | ForEach-Object {
            $xml = Get-Content $_.FullName -Raw
            $xml = $xml.Replace('v142','v143')
            $xml = $xml.Replace('<EnableASAN>true</EnableASAN>','<EnableASAN>false</EnableASAN>')
            Set-Content $_.FullName $xml
          }

      - name: Download Jungle CV5 and ramp references
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MaksymAlokhin/StarCraftMapBrowser/master/Tileset/jungle.cv5" -OutFile "$env:RUNNER_TEMP\jungle.cv5"

          $headers = @{ 'User-Agent' = 'Mozilla/5.0' }
          $zip = "$env:RUNNER_TEMP\FalkonersTerrain.zip"
          try {
            Invoke-WebRequest -Uri "https://staredit.net/sc1db/download/13/" -Headers $headers -MaximumRedirection 10 -OutFile $zip
            Write-Host "Falkoner ZIP bytes: $((Get-Item $zip).Length)"
            Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\Falkoner" -Force
          } catch {
            Write-Warning "Falkoner download failed: $_"
          }

          $fs = "$env:RUNNER_TEMP\Fighting_Spirit_1.3_MLC.scx"
          Invoke-WebRequest -Uri "https://scmscx.com/api/maps/df7d5e430027644b96109934b5e9233111aa049385187b79fa0bafa11720c34b" -Headers $headers -OutFile $fs
          Write-Host "Fighting Spirit bytes: $((Get-Item $fs).Length)"

          if (Test-Path "$env:RUNNER_TEMP\Falkoner") {
            Get-ChildItem "$env:RUNNER_TEMP\Falkoner" -Recurse -File | Where-Object { $_.Name -match 'Jungle.*(Ramp|Doodad).*\.(scx|scm)$' } | Select-Object FullName,Length | Format-Table -AutoSize
          }

      - name: Build probe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          msbuild "%RUNNER_TEMP%\IsomTerrain\IsomTerrain.sln" /m /p:Configuration=ReleaseUS /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0

      - name: Probe reference terrain
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\IsomTerrain\x64\ReleaseUS\IsomTerrain.exe"
          $maps = @()
          if (Test-Path "$env:RUNNER_TEMP\Falkoner") {
            $targets = Get-ChildItem "$env:RUNNER_TEMP\Falkoner" -Recurse -File | Where-Object {
              $_.Name -in @('Jungle Doodad Database.scx','Jungle Ramp Database.scx','Jungle Custom Ramps.scx')
            }
            $maps += $targets.FullName
          }
          $maps += "$env:RUNNER_TEMP\Fighting_Spirit_1.3_MLC.scx"
          Write-Host "Probe maps:"
          $maps | ForEach-Object { Write-Host "  $_" }
          & $exe "$env:RUNNER_TEMP\jungle.cv5" @maps 2>&1 | Tee-Object -FilePath "ramp-probe.txt"
          if ($LASTEXITCODE -ne 0) { throw "Ramp probe failed with exit code $LASTEXITCODE" }

      - name: Upload probe log and references
        uses: actions/upload-artifact@v4
        with:
          name: patellar-jungle-ramp-probe
          path: |
            ramp-probe.txt
            ${{ runner.temp }}/Fighting_Spirit_1.3_MLC.scx
            ${{ runner.temp }}/Falkoner/Jungle/Jungle Doodad Database.scx
            ${{ runner.temp }}/Falkoner/Jungle/Jungle Ramp Database.scx
            ${{ runner.temp }}/Falkoner/Jungle/Jungle Custom Ramps.scx
          if-no-files-found: warn
