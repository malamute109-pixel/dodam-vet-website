name: Patellar Jungle Ramp Probe

on:
  push:
    branches:
      - chatgpt-patellar-isom-build
    paths:
      - 'tools/patellar_ramp_probe.cpp'
      - '.github/workflows/patellar-ramp-db-probe.yml'
  workflow_dispatch:

jobs:
  probe-ramps:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Clone IsomTerrain
        shell: pwsh
        run: git clone --depth 1 https://github.com/TheNitesWhoSay/IsomTerrain.git "$env:RUNNER_TEMP\IsomTerrain"
      - name: Install probe and VS2022 settings
        shell: pwsh
        run: |
          Copy-Item "tools\patellar_ramp_probe.cpp" "$env:RUNNER_TEMP\IsomTerrain\IsomTerrain\Main.cpp" -Force
          Get-ChildItem "$env:RUNNER_TEMP\IsomTerrain" -Filter *.vcxproj -Recurse | ForEach-Object {
            $xml = Get-Content $_.FullName -Raw
            $xml = $xml.Replace('v142','v143').Replace('<EnableASAN>true</EnableASAN>','<EnableASAN>false</EnableASAN>')
            Set-Content $_.FullName $xml
          }
      - name: Download Jungle tileset and custom ramp reference
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MaksymAlokhin/StarCraftMapBrowser/master/Tileset/jungle.cv5" -OutFile "$env:RUNNER_TEMP\jungle.cv5"
          $headers=@{'User-Agent'='Mozilla/5.0'}
          $zip="$env:RUNNER_TEMP\FalkonersTerrain.zip"
          Invoke-WebRequest -Uri "https://staredit.net/sc1db/download/13/" -Headers $headers -MaximumRedirection 10 -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\Falkoner" -Force
      - name: Build probe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          msbuild "%RUNNER_TEMP%\IsomTerrain\IsomTerrain.sln" /m /p:Configuration=ReleaseUS /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0
      - name: Probe custom ramp regions
        shell: pwsh
        run: |
          $exe="$env:RUNNER_TEMP\IsomTerrain\x64\ReleaseUS\IsomTerrain.exe"
          & $exe "$env:RUNNER_TEMP\jungle.cv5" "$env:RUNNER_TEMP\Falkoner\Jungle\Jungle Custom Ramps.scx" 2>&1 | Tee-Object -FilePath ramp-region-probe.txt
          if($LASTEXITCODE -ne 0){ throw "probe failed $LASTEXITCODE" }
      - name: Upload probe data
        uses: actions/upload-artifact@v4
        with:
          name: patellar-jungle-ramp-region-probe
          path: |
            ramp-region-probe.txt
            *.csv
          if-no-files-found: error
